[project]
name = "pacman-42"
version = "0.1.0"
description = "Classic arcade game Pac-Man in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.4.1",
    "mazegenerator",
    "pygame",
    "mypy>=2.4.0",
    "pydantic>=2.13.5",
]

[project.scripts]
pacman-42 = "src.__main__:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }
